name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          TURSO_DATABASE_URL: libsql://placeholder.turso.io
          TURSO_AUTH_TOKEN: placeholder
          JWT_SECRET: ci-placeholder-secret
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: CiPlaceholder1!
          NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: placeholder
          CLOUDINARY_API_KEY: placeholder
          CLOUDINARY_API_SECRET: placeholder
